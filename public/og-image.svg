<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080d16" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#14b8a6"/>
      <stop offset="50%"  stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="10%" cy="15%" r="55%">
      <stop offset="0%"   stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="80%" r="45%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080d16"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left accent line -->
  <rect x="80" y="180" width="3" height="180" rx="2" fill="url(#nameGrad)"/>

  <!-- OA Logo mark -->
  <rect x="80" y="80" width="52" height="52" rx="14" fill="url(#badgeGrad)"/>
  <text x="106" y="114" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle">OA</text>

  <!-- Tunmise.dev wordmark -->
  <text x="148" y="114" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#dce8f0" letter-spacing="-0.5">Tunmise.dev</text>

  <!-- Main name -->
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#dce8f0" letter-spacing="-3">Oluwatunmise</text>
  <text x="100" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="url(#nameGrad)" letter-spacing="-3">Ayeni</text>

  <!-- Role badge -->
  <rect x="100" y="405" width="380" height="42" rx="21" fill="rgba(20,184,166,0.1)" stroke="rgba(20,184,166,0.3)" stroke-width="1.5"/>
  <circle cx="126" cy="426" r="5" fill="#14b8a6">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="145" y="432" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#14b8a6" letter-spacing="1.5">BACKEND DEVELOPER</text>

  <!-- Description -->
  <text x="100" y="500" font-family="system-ui, sans-serif" font-size="22" font-weight="300" fill="rgba(220,232,240,0.45)">Building REST APIs &amp; services with Node.js, TypeScript &amp; PostgreSQL</text>
  <text x="100" y="530" font-family="system-ui, sans-serif" font-size="22" font-weight="300" fill="rgba(220,232,240,0.45)">Based in Lagos, Nigeria  ·  Open to opportunities</text>

  <!-- Tech pills -->
  <rect x="100" y="560" width="96"  height="32" rx="8" fill="rgba(104,160,99,0.12)"  stroke="rgba(104,160,99,0.25)"  stroke-width="1"/>
  <text x="148" y="581" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#68A063" text-anchor="middle">Node.js</text>

  <rect x="208" y="560" width="112" height="32" rx="8" fill="rgba(49,120,198,0.12)"  stroke="rgba(49,120,198,0.3)"   stroke-width="1"/>
  <text x="264" y="581" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#6ea8e0" text-anchor="middle">TypeScript</text>

  <rect x="332" y="560" width="92"  height="32" rx="8" fill="rgba(170,170,170,0.1)"  stroke="rgba(170,170,170,0.25)" stroke-width="1"/>
  <text x="378" y="581" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">Express</text>

  <rect x="436" y="560" width="112" height="32" rx="8" fill="rgba(51,103,145,0.14)"  stroke="rgba(51,103,145,0.35)"  stroke-width="1"/>
  <text x="492" y="581" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#7fa8d0" text-anchor="middle">PostgreSQL</text>

  <!-- Right side decorative card -->
  <rect x="820" y="120" width="300" height="380" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Terminal dots -->
  <circle cx="850" cy="158" r="7" fill="#ff5f57"/>
  <circle cx="871" cy="158" r="7" fill="#febc2e"/>
  <circle cx="892" cy="158" r="7" fill="#28c840"/>
  <text x="910" y="164" font-family="monospace" font-size="11" fill="rgba(220,232,240,0.2)">tunmise ~ zsh</text>

  <!-- Terminal content -->
  <text x="845" y="210" font-family="monospace" font-size="14" fill="#14b8a6">❯ </text>
  <text x="865" y="210" font-family="monospace" font-size="14" fill="#34d399">whoami</text>
  <text x="845" y="235" font-family="monospace" font-size="14" fill="rgba(220,232,240,0.35)">oluwatunmise-ayeni</text>

  <text x="845" y="270" font-family="monospace" font-size="14" fill="#14b8a6">❯ </text>
  <text x="865" y="270" font-family="monospace" font-size="14" fill="#34d399">cat stack.json</text>
  <text x="845" y="295" font-family="monospace" font-size="14" fill="rgba(220,232,240,0.35)">{</text>
  <text x="845" y="318" font-family="monospace" font-size="13" fill="rgba(220,232,240,0.35)">  <tspan fill="#fbbf24">"core"</tspan>: ["Node.js","TS"],</text>
  <text x="845" y="340" font-family="monospace" font-size="13" fill="rgba(220,232,240,0.35)">  <tspan fill="#fbbf24">"data"</tspan>: ["Postgres"],</text>
  <text x="845" y="362" font-family="monospace" font-size="13" fill="rgba(220,232,240,0.35)">  <tspan fill="#fbbf24">"status"</tspan>: <tspan fill="#34d399">"open"</tspan></text>
  <text x="845" y="385" font-family="monospace" font-size="14" fill="rgba(220,232,240,0.35)">}</text>

  <!-- Stats row -->
  <rect x="845" y="415" width="82" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="886" y="444" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#14b8a6" text-anchor="middle">3+</text>
  <text x="886" y="462" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(220,232,240,0.35)" text-anchor="middle" letter-spacing="1">YRS</text>

  <rect x="939" y="415" width="82" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="980" y="444" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#14b8a6" text-anchor="middle">2nd</text>
  <text x="980" y="462" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(220,232,240,0.35)" text-anchor="middle" letter-spacing="1">CONRAD</text>

  <!-- Bottom border accent -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#nameGrad)" opacity="0.4"/>
</svg>
